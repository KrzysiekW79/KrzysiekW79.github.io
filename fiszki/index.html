<style>
/* Jedna fiszka na biurku naraz: papier w linie, czerwona linia pod nagłówkiem,
   zakreślacz w kolorach z jej notatek. */
:root {
  --desk: #E3E7EE;
  --paper: #FFFDF8;
  --ink: #1B2333;
  --muted: #5A6375;
  --line: rgba(27, 35, 51, .12);
  --rule-red: #CF4A42;
  --rule-blue: #DCE5F2;
  --accent: #23407D;
  --accent-ink: #FFFFFF;
  --hl-c: rgba(60, 210, 235, .36);
  --hl-y: rgba(255, 216, 40, .55);
  --good: #1D7A4C;
  --good-soft: rgba(29, 122, 76, .12);
  --miss: #B0372F;
  --miss-soft: rgba(176, 55, 47, .09);
  --shadow: 0 1px 0 rgba(27, 35, 51, .06), 0 18px 40px -22px rgba(23, 35, 60, .45);
  --f-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --rule: 2rem;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --desk: #0F1218; --paper: #1A1F29; --ink: #E6E9EF; --muted: #98A1B3;
    --line: rgba(230, 233, 239, .12); --rule-red: #E0695E; --rule-blue: #252D3B;
    --accent: #A3BAF0; --accent-ink: #0F1218;
    --hl-c: rgba(60, 210, 235, .26); --hl-y: rgba(255, 210, 40, .26);
    --good: #5CC28D; --good-soft: rgba(92, 194, 141, .14);
    --miss: #F08379; --miss-soft: rgba(240, 131, 121, .11);
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 18px 40px -22px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--desk);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.55;
  padding: calc(24px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 6px 20px; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(30px, 7vw, 40px); line-height: 1.05; margin: 0; letter-spacing: -.01em; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--line); border-radius: 10px; }
.seg button { font: inherit; font-size: 14px; border: 0; background: transparent; color: var(--muted); padding: 5px 10px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.stage { perspective: 1600px; }
.card { background: var(--paper); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; transform-origin: center; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 22px 10px; border-bottom: 2px solid var(--rule-red); }
.chip { font-family: var(--f-mono); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--rule-red); }
.chip .of { color: var(--muted); }

.ruled {
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--rule) - 1px), var(--rule-blue) calc(var(--rule) - 1px), var(--rule-blue) var(--rule));
  background-attachment: local;
}
.front { width: 100%; text-align: left; font: inherit; color: inherit; border: 0; background-color: transparent; cursor: pointer; padding: 28px 22px 30px; display: block; }
.q { display: block; font-family: var(--f-display); font-weight: 500; margin: 0; font-size: clamp(27px, 6.4vw, 36px); line-height: 1.18; text-wrap: balance; letter-spacing: -.005em; }

.speak { padding: 0 22px 18px; display: flex; flex-direction: column; gap: 10px; }
.mic-row { display: flex; align-items: center; gap: 12px; }
.mic {
  font: inherit; font-size: 17px; font-weight: 700; cursor: pointer;
  display: inline-flex; align-items: center; gap: 10px;
  border-radius: 999px; padding: 12px 22px 12px 16px;
  background: var(--accent); color: var(--accent-ink); border: 0;
}
.mic .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--rule-red); box-shadow: 0 0 0 3px var(--accent-ink); }
.mic.on { background: var(--miss); color: var(--paper); }
.mic.on .dot { background: var(--paper); box-shadow: none; animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(.55); opacity: .6; } }
.mic-msg { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.4; min-width: 0; }
textarea {
  width: 100%; min-height: calc(var(--rule) * 4); resize: vertical;
  font: inherit; font-size: 17px; line-height: var(--rule); color: var(--ink);
  border: 1px solid var(--line); border-radius: 4px; padding: 0 12px;
  background-color: var(--paper); background-position: 0 -1px;
}
textarea::placeholder { color: var(--muted); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 22px 18px; border-top: 1px solid var(--line); background: var(--paper); }
.btn { font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; border-radius: 10px; padding: 13px 18px; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1 1 auto; }
.btn.ghost { background: transparent; color: var(--muted); border-color: var(--line); font-weight: 400; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.back-q { padding: 18px 22px 0; font-family: var(--f-display); font-size: 22px; line-height: 1.25; font-weight: 500; text-wrap: balance; }
.label { font-family: var(--f-mono); font-size: 12px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }

.result { margin: 16px 22px 0; padding: 16px; border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; gap: 12px; }
.score { display: flex; align-items: center; gap: 14px; }
.score-num { font-family: var(--f-display); font-weight: 600; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.score-num small { font-size: 20px; color: var(--muted); }
.score-txt { display: flex; flex-direction: column; min-width: 0; }
.score-txt b { font-size: 17px; }
.score-txt span { font-size: 14px; color: var(--muted); }
.meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--good); border-radius: 4px; }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.chips li { font-size: 14px; line-height: 1.3; padding: 5px 9px; border-radius: 6px; }
.chips.ok li { background: var(--good-soft); color: var(--good); }
.chips.ok li::before { content: "✓ "; font-weight: 700; }
.chips.miss li { background: var(--miss-soft); color: var(--miss); }
.note { margin: 0; font-size: 13px; color: var(--muted); }
details.yours summary { cursor: pointer; font-size: 14px; color: var(--muted); }
details.yours p { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

.model { padding: 18px 22px 8px; }
.model-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.answer { max-width: 68ch; overflow-wrap: anywhere; }
.answer p { margin: 0 0 .7em; }
.answer h4 { font-family: var(--f-display); font-size: 20px; font-weight: 600; margin: 1.1em 0 .35em; line-height: 1.25; }
.answer ul, .answer ol { margin: 0 0 .8em; padding-left: 1.3em; }
.answer li { margin: .15em 0; }
.answer mark { color: inherit; padding: 0 .1em; border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.answer mark.hl-c { background: var(--hl-c); }
.answer mark.hl-y { background: var(--hl-y); }
.answer .faded { color: var(--muted); opacity: .75; }
.legend { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.legend mark { background: var(--hl-c); color: inherit; padding: 0 .3em; border-radius: 2px; }
.sticky { position: sticky; bottom: 0; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }

details.all { background: var(--paper); border-radius: 6px; box-shadow: var(--shadow); }
details.all summary { cursor: pointer; padding: 15px 22px; font-weight: 700; }
.qlist-wrap { padding: 0 22px 18px; display: flex; flex-direction: column; gap: 12px; }
.search { width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--desk); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.qlist { list-style: none; margin: 0; padding: 0; }
.qlist li { border-top: 1px solid var(--line); }
.qlist button { width: 100%; text-align: left; font: inherit; font-size: 16px; color: var(--ink); background: none; border: 0; padding: 11px 0; cursor: pointer; display: grid; grid-template-columns: 2.4em 1fr; gap: 8px; align-items: baseline; }
.qlist .num { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.empty { color: var(--muted); font-size: 15px; margin: 0; }

@media (max-width: 520px) {
  body { font-size: 16px; }
  .card-head, .front, .speak, .actions, .model, .back-q, .qlist-wrap { padding-left: 16px; padding-right: 16px; }
  .result { margin-left: 16px; margin-right: 16px; }
  details.all summary { padding-left: 16px; }
}
@media (prefers-reduced-motion: reduce) { .mic.on .dot { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>

<script>
const CARDS = [{"id":"z1","d":"z","n":1,"q":"Metody badawcze w naukach społecznych","a":[{"k":"p","r":[["W naukach społecznych badacze analizują zachowania ludzi, ich opinie, relacje społeczne oraz różne zjawiska występujące w społeczeństwie. Do tego wykorzystuje się różne metody badawcze.",0,0]]},{"k":"h","r":[["Najczęściej dzieli się je na",1,"c"]]},{"k":"ul","r":[["metody jakościowe,",1,"c"]]},{"k":"ul","r":[["ilościowe",1,"c"]]},{"k":"ul","r":[["mieszane.",1,"c"]]},{"k":"p","r":[["Metody jakościowe",1,"c"],[" polegają na dokładnym poznaniu danego zjawiska.",0,0]]},{"k":"p","r":[["Skupiają się przede wszystkim na opisach, znaczeniach i doświadczeniach ludzi.",0,0]]},{"k":"p","r":[["Dzięki nim można lepiej zrozumieć, dlaczego ludzie zachowują się w określony sposób albo jak postrzegają daną sytuację.",0,0]]},{"k":"p","r":[["Do metod jakościowych należą m.in.",0,0]]},{"k":"p","r":[["wywiady,",1,"c"]]},{"k":"h","r":[["obserwacje",1,"c"]]},{"k":"p","r":[["analiza treści",1,"c"],[", czyli analiza dokumentów, wypowiedzi, lub materiałów wizualnych.",0,0]]},{"k":"p","r":[["Metody ilościowe",1,"c"],[" polegają na zbieraniu danych, które można policzyć i porównać.",0,0]]},{"k":"p","r":[["Ich celem jest uzyskanie bardziej obiektywnych wyników, często na podstawie większej grupy badanych osób.",0,0]]},{"k":"p","r":[["Do metod ilościowych zalicza się:",0,0]]},{"k":"h","r":[["Ankiety",1,"c"]]},{"k":"h","r":[["eksperymenty",1,"c"]]},{"k":"p","r":[["analizę gotowych danych",1,"c"],[", np. statystyk lub raportów.",0,0]]},{"k":"p","r":[["Metody mieszane",1,"c"],[" łączą metody jakościowe i ilościowe.",0,0]]},{"k":"p","r":[["Oznacza to, że badacz może najpierw przeprowadzić wywiady, aby lepiej poznać problem, a później przygotować ankietę i sprawdzić swoje wnioski na większej grupie osób.",0,0]]},{"k":"p","r":[["Takie podejście pozwala uzyskać pełniejszy obraz badanego zjawiska.",0,0]]},{"k":"p","r":[["Podsumowując, ",0,0],["metody jakościowe",1,0],[" pomagają zrozumieć przyczyny i znaczenia, ",0,0],["metody ilościowe",1,0],[" pokazują dane liczbowe i skalę zjawiska, a ",0,0],["metody mieszane",1,0],[" łączą oba te podejścia.",0,0]]}],"k":[{"t":"metody jakościowe","s":["jakosci","meto"]},{"t":"ilościowe","s":["ilosci"]},{"t":"mieszane","s":["miesz"]},{"t":"wywiady","s":["wywi"]},{"t":"obserwacje","s":["obserwa"]},{"t":"analiza treści","s":["anal","tres"]},{"t":"Metody ilościowe","s":["ilosci","meto"]},{"t":"Ankiety","s":["anki"]},{"t":"eksperymenty","s":["eksperyme"]},{"t":"analizę gotowych danych","s":["anal","dany","gotow"]},{"t":"Metody mieszane","s":["meto","miesz"]}]},{"id":"z2","d":"z","n":2,"q":"Etapy procesu badawczego","a":[{"k":"p","r":[["1. ",1,0],["Określenie przedmiotu badań",1,"c"],["\nNa początku należy ustalić, co dokładnie będzie badane. Przedmiotem badań mogą być np. zachowania ludzi, opinie, cechy określonej grupy, działania instytucji albo konkretne zjawiska społeczne.",0,0]]},{"k":"p","r":[["2. Sformułowanie celu i problemu badawczego",1,"c"],["\nNastępnie określa się, po co prowadzone są badania i na jakie pytania mają one odpowiedzieć.",0,0]]},{"k":"p","r":[["Problem badawczy to najważniejsze pytanie, które wyznacza kierunek całego badania.",0,0]]},{"k":"p","r":[["Można też wskazać problemy szczegółowe, czyli mniejsze pytania pomocnicze.",0,0]]},{"k":"p","r":[["3. Sformułowanie hipotez badawczych",1,"c"],["\nHipoteza to przypuszczalna odpowiedź na problem badawczy. Badacz zakłada, jaki może być wynik badań, a następnie sprawdza, czy to przypuszczenie się potwierdzi. W razie potrzeby można sformułować także hipotezy szczegółowe.",0,0]]},{"k":"p","r":[["4. Ustalenie zmiennych i wskaźników",1,"c"],["\nNa tym etapie określa się, jakie elementy będą mierzone lub obserwowane.",0,0]]},{"k":"p","r":[["Zmienne to cechy lub zjawiska, które mogą się zmieniać, np. wiek, poziom wykształcenia, opinia czy zachowanie. Wskaźniki pokazują, jak można te zmienne rozpoznać lub zmierzyć.",0,0]]},{"k":"p","r":[["5. Ustalenie terenu badań i do , obligacji, funduszy lub innych instrumentów finansowych. Celem zarządzania portfelem jest osiągnięcie oczekiwanej stopy zwrotu przy akceptowalnym poziomie ryzyka.",1,"c"]]},{"k":"h","r":[["Zarządzanie portfelem",1,0]]},{"k":"p","r":[["Zarządzanie portfelem obejmuje trzy podstawowe etapy:",0,0]]},{"k":"ul","r":[["planowanie – określenie celu inwestora, poziomu akceptowanego ryzyka, horyzontu inwestycyjnego i ograniczeń,",1,"c"]]},{"k":"ul","r":[["budowę portfela – wybór konkretnych aktywów oraz ustalenie ich udziału w portfelu,",1,"c"]]},{"k":"ul","r":[["kontrolę – monitorowanie wyników portfela i wprowadzanie zmian, gdy sytuacja rynkowa lub cele inwestora się zmieniają.",1,"c"]]},{"k":"p","r":[["Bardzo ważna jest ",0,0],["dywersyfikacja, czyli rozłożenie środków między różne aktywa",1,"c"],[". Dzięki temu strata na jednym instrumencie może być częściowo zrekompensowana zyskiem na innym.",0,0]]},{"k":"h","r":[["Strategie zarządzania",1,0]]},{"k":"ul","r":[["strategie pasywne – polegają na naśladowaniu rynku lub indeksu, np. indeksu giełdowego,",1,"c"]]},{"k":"ul","r":[["strategie aktywne – polegają na aktywnym wyborze inwestycji w celu osiągnięcia wyniku lepszego niż rynek,",1,"c"]]},{"k":"ul","r":[["strategie zabezpieczające – mają ograniczać ryzyko, np. przez odpowiedni dobór obligacji lub instrumentów ochronnych.",1,"c"]]},{"k":"p","r":[["Teoria Markowitza",0,0]]},{"k":"p","r":[["W teorii Markowitza portfel efektywny to taki, który daje możliwie najwyższy zysk przy danym poziomie ryzyka albo najniższe ryzyko przy oczekiwanym poziomie zysku.",1,"c"]]},{"k":"h","r":[["Rodzaje ryzyka",1,0]]},{"k":"p","r":[["Najważniejsze rodzaje ryzyka w analizie portfelowej to:",0,0]]},{"k":"ul","r":[["ryzyko całkowite – obejmuje całe ryzyko związane z inwestycją,",1,"c"]]},{"k":"ul","r":[["ryzyko systematyczne – wynika z sytuacji całego rynku, np. kryzysu, inflacji lub zmian stóp procentowych; nie da się go usunąć przez dywersyfikację,",1,"c"]]},{"k":"ul","r":[["ryzyko specyficzne – dotyczy konkretnej spółki lub instrumentu; można je ograniczyć przez dywersyfikację,",1,"c"]]},{"k":"ul","r":[["ryzyko rynkowe – wynika ze zmian cen aktywów na rynku,",1,"c"]]},{"k":"ul","r":[["ryzyko stopy procentowej – dotyczy głównie obligacji, ponieważ zmiany stóp wpływają na ich wartość,",1,"c"]]},{"k":"ul","r":[["ryzyko walutowe – występuje przy inwestycjach zagranicznych i wynika ze zmian kursów walut,",1,"c"]]},{"k":"ul","r":[["ryzyko płynności – oznacza trudność szybkiej sprzedaży aktywa bez poniesienia straty.",1,"c"]]},{"k":"h","r":[["Miary ryzyka",1,0]]},{"k":"p","r":[["Do oceny ryzyka wykorzystuje się m.in.:",0,0]]},{"k":"ul","r":[["odchylenie standardowe,",1,"c"]]},{"k":"ul","r":[["wariancję,",1,"c"]]},{"k":"ul","r":[["współczynnik zmienności,",1,"c"]]},{"k":"ul","r":[["współczynnik beta.",1,"c"]]},{"k":"h","r":[["Współczynnik Beta",1,0]]},{"k":"p","r":[["Beta pokazuje, jak dana inwestycja reaguje na zmiany rynku.",1,"c"]]},{"k":"ul","r":[["Beta powyżej 1 oznacza większą zmienność niż rynek,",1,"c"]]},{"k":"ul","r":[["Beta poniżej 1 oznacza inwestycję bardziej defensywną.",1,"c"]]}],"k":[{"t":"Zarządzanie portfelem","s":["portfe","zarzadza"]},{"t":"planowanie","s":["planowa"]},{"t":"budowę portfela","s":["budo","portf"]},{"t":"kontrolę","s":["kontr"]},{"t":"Strategie zarządzania","s":["strate","zarzadza"]},{"t":"strategie pasywne","s":["pasy","strate"]},{"t":"strategie aktywne","s":["akty","strate"]},{"t":"strategie zabezpieczające","s":["strate","zabezpieczaj"]},{"t":"Rodzaje ryzyka","s":["ryzy"]},{"t":"ryzyko całkowite","s":["calkow","ryzy"]},{"t":"ryzyko systematyczne","s":["ryzy","systematyc"]},{"t":"ryzyko specyficzne","s":["ryzy","specyfic"]},{"t":"ryzyko rynkowe","s":["rynk","ryzy"]},{"t":"ryzyko stopy procentowej","s":["procento","ryzy","stop"]},{"t":"ryzyko walutowe","s":["ryzy","walut"]},{"t":"ryzyko płynności","s":["plynno","ryzy"]},{"t":"Miary ryzyka","s":["miar","ryzy"]},{"t":"odchylenie standardowe","s":["odchyle","standard"]},{"t":"wariancję","s":["warian"]},{"t":"współczynnik zmienności","s":["wspolczyn","zmienno"]},{"t":"współczynnik beta","s":["beta","wspolczyn"]}]},{"id":"z22","d":"z","n":22,"q":"Portfel efektywny w teorii Markowitza","a":[{"k":"p","r":[["Portfel efektywny to pojęcie związane z teorią portfela stworzoną przez Harry’ego Markowitza. Zakłada ona, że racjonalny inwestor dąży do uzyskania jak najwyższej stopy zwrotu przy jak najniższym poziomie ryzyka.",1,"c"]]},{"k":"h","r":[["Istota portfela efektywnego",1,0]]},{"k":"p","r":[["Portfel efektywny można rozumieć na dwa sposoby:",0,0]]},{"k":"ul","r":[["przy danym poziomie ryzyka daje najwyższą możliwą oczekiwaną stopę zwrotu,",1,"c"]]},{"k":"ul","r":[["przy danej oczekiwanej stopie zwrotu ma najniższe możliwe ryzyko.",1,"c"]]},{"k":"p","r":[["Oznacza to, że inwestor nie powinien wybierać portfela, który przy takim samym ryzyku daje niższy zysk albo przy takim samym zysku ma wyższe ryzyko.",0,0]]},{"k":"p","r":[["Granica efektywna - zbiór wszystkich portfeli efektywnych. Są to najlepsze możliwe kombinacje aktywów pod względem relacji zysku do ryzyka.",1,"c"]]},{"k":"p","r":[["Na granicy efektywnej znajdują się portfele, które są najbardziej opłacalne dla inwestora przy określonym poziomie ryzyka.",1,"c"]]},{"k":"h","r":[["Ryzyko i stopa zwrotu",1,0]]},{"k":"p","r":[["W teorii Markowitza:",0,0]]},{"k":"ul","r":[["oczekiwana stopa zwrotu portfela zależy od stóp zwrotu poszczególnych aktywów i ich udziału w portfelu,",1,"c"]]},{"k":"ul","r":[["ryzyko portfela mierzy się najczęściej wariancją lub odchyleniem standardowym,",1,"c"]]},{"k":"ul","r":[["ryzyko zależy nie tylko od ryzyka pojedynczych aktywów, ale także od korelacji między nimi.",1,"c"]]},{"k":"h","r":[["Znaczenie dywersyfikacji",1,0]]},{"k":"p","r":[["Bardzo ważnym elementem teorii Markowitza jest dywersyfikacja, czyli podział środków między różne aktywa.",1,"c"]]},{"k":"p","r":[["Jeżeli aktywa w portfelu nie są ze sobą silnie dodatnio skorelowane, ryzyko całego portfela może być niższe. Najlepsza sytuacja występuje wtedy, gdy aktywa mają niską albo ujemną korelację.",1,"c"]]},{"k":"p","r":[["Dzięki dywersyfikacji można ograniczyć ryzyko portfela bez konieczności rezygnowania z oczekiwanej stopy zwrotu.",1,"c"]]},{"k":"h","r":[["Portfel minimalnego ryzyka",1,0]]},{"k":"p","r":[["W teorii Markowitza wyróżnia się również portfel minimalnego ryzyka, czyli MVP.",1,"c"]]},{"k":"p","r":[["Jest to portfel, który ma najniższe możliwe ryzyko spośród wszystkich dostępnych kombinacji aktywów.",1,"c"]]},{"k":"p","r":[["Portfele efektywne znajdują się powyżej portfela minimalnego ryzyka na granicy efektywnej.",0,0]]}],"k":[{"t":"Istota portfela efektywnego","s":["efektywn","isto","portf"]},{"t":"Ryzyko i stopa zwrotu","s":["ryzy","stop","zwro"]},{"t":"Znaczenie dywersyfikacji","s":["dywersyfika","znacze"]},{"t":"Portfel minimalnego ryzyka","s":["minimaln","port","ryzy"]},{"t":"MVP","s":["mvp"],"a":1}]},{"id":"z23","d":"z","n":23,"q":"Miary oceny efektywności zarządzania portfelem inwestycyjnym","a":[{"k":"p","r":[["Ocena efektywności zarządzania portfelem inwestycyjnym polega na sprawdzeniu, czy zarządzający osiągnął odpowiednią stopę zwrotu przy danym poziomie ryzyka. Nie wystarczy więc ocenić sam zysk — trzeba sprawdzić, jakie ryzyko zostało podjęte, aby ten zysk osiągnąć.",1,"c"]]},{"k":"h","r":[["Etapy oceny portfela",1,0]]},{"k":"ul","r":[["pomiar wyników – ustalenie faktycznej stopy zwrotu portfela,",1,"c"]]},{"k":"ul","r":[["porównanie z benchmarkiem – czyli odniesienie wyników do rynku lub podobnych funduszy,",1,"c"]]},{"k":"ul","r":[["analizę źródeł wyniku – sprawdzenie, czy wynik wynikał z dobrej selekcji aktywów, dywersyfikacji czy sytuacji rynkowej.",1,"c"]]},{"k":"h","r":[["Podstawowe miary stopy zwrotu",1,0]]},{"k":"p","r":[["Do pomiaru wyników portfela stosuje się m.in.:",0,0]]},{"k":"ul","r":[["TWR – stopa zwrotu ważona czasem, używana do oceny pracy zarządzającego,",1,"c"]]},{"k":"ul","r":[["MWR – stopa zwrotu ważona pieniądzem, uwzględniająca wielkość i moment wpłat oraz wypłat inwestora.",1,"c"]]},{"k":"h","r":[["Miary efektywności skorygowane o ryzyko",1,0]]},{"k":"ul","r":[["wskaźnik Sharpe’a – pokazuje nadwyżkę stopy zwrotu ponad stopę wolną od ryzyka w stosunku do całkowitego ryzyka portfela,",1,"c"]]},{"k":"ul","r":[["wskaźnik Treynora – pokazuje nadwyżkę stopy zwrotu ponad stopę wolną od ryzyka w stosunku do ryzyka systematycznego, mierzonego betą,",1,"c"]]},{"k":"ul","r":[["alfa Jensena – pokazuje, czy portfel osiągnął wynik lepszy lub gorszy niż wynikałoby to z modelu CAPM,",1,"c"]]},{"k":"ul","r":[["Information Ratio – mierzy nadwyżkę wyniku portfela nad benchmarkiem w stosunku do ryzyka odchyleń od benchmarku,",1,"c"]]},{"k":"h","r":[["Różnica między Sharpe’em a Treynorem",1,0]]},{"k":"p","r":[["Wskaźnik Sharpe’a uwzględnia ryzyko całkowite, dlatego dobrze pokazuje, czy portfel jest odpowiednio zdywersyfikowany.",1,"c"]]},{"k":"p","r":[["Wskaźnik Treynora uwzględnia tylko ryzyko systematyczne, czyli rynkowe. Dlatego jest bardziej przydatny przy ocenie portfeli dobrze zdywersyfikowanych.",1,"c"]]},{"k":"h","r":[["Dodatkowe metody oceny",1,0]]},{"k":"p","r":[["W ocenie zarządzającego analizuje się także:",0,0]]},{"k":"ul","r":[["selekcję aktywów – czy zarządzający dobrze wybrał konkretne papiery wartościowe,",0,0]]},{"k":"ul","r":[["dywersyfikację – czy portfel był odpowiednio rozłożony między różne aktywa,",0,0]]}],"k":[{"t":"Etapy oceny portfela","s":["etap","ocen","portf"]},{"t":"pomiar wyników","s":["pomi","wyni"]},{"t":"porównanie z benchmarkiem","s":["benchmark","porowna"]},{"t":"analizę źródeł wyniku","s":["anal","wyni","zrod"]},{"t":"Podstawowe miary stopy zwrotu","s":["miar","stop","zwro"]},{"t":"TWR","s":["twr"],"a":1},{"t":"MWR","s":["mwr"],"a":1},{"t":"Miary efektywności skorygowane o ryzyko","s":["efektywno","miar","ryzy","skorygow"]},{"t":"wskaźnik Sharpe’a","s":["shar","wskaz"]},{"t":"wskaźnik Treynora","s":["treyn","wskaz"]},{"t":"alfa Jensena","s":["alfa","jens"]},{"t":"Information Ratio","s":["informat","rati"]},{"t":"Różnica między Sharpe’em a Treynorem","s":["rozn","shar","treyno"]},{"t":"Dodatkowe metody oceny","s":["dodatk","meto","ocen"]},{"t":"selekcję aktywów","s":["akty","selek"]},{"t":"dywersyfikację","s":["dywersyfika"]},{"t":"CAPM","s":["capm"],"a":1}]},{"id":"z24","d":"z","n":24,"q":"System emerytalny i system ubezpieczeń zdrowotnych w Polsce","a":[{"k":"p","r":[["Polski system zabezpieczenia społecznego obejmuje m.in. system emerytalny oraz system ubezpieczenia zdrowotnego. Oba systemy są ze sobą powiązane, ale pełnią inne funkcje. System emerytalny ma zapewnić dochód po zakończeniu aktywności zawodowej, a system zdrowotny ma zapewnić dostęp do świadczeń medycznych.",1,"c"]]},{"k":"h","r":[["System emerytalny w Polsce",1,"c"]]},{"k":"p","r":[["System emerytalny w Polsce został zreformowany od 1 stycznia 1999 r. i opiera się na modelu trzech filarów.",1,"c"]]},{"k":"p","r":[["I filar jest obowiązkowy, publiczny i prowadzony przez ZUS. Ma charakter repartycyjny, co oznacza, że składki osób pracujących finansują bieżące emerytury. Wysokość przyszłej emerytury zależy głównie od sumy zgromadzonych składek, ich waloryzacji oraz dalszego przewidywanego trwania życia.",1,"c"]]},{"k":"p","r":[["II filar obejmuje subkonto w ZUS oraz Otwarte Fundusze Emerytalne, czyli OFE. Ma charakter mieszany, ponieważ łączy elementy publiczne i kapitałowe. Środki zgromadzone w II filarze mogą podlegać dziedziczeniu.",1,"c"]]},{"k":"p","r":[["III filar jest dobrowolny i prywatny. Służy dodatkowemu oszczędzaniu na emeryturę. Obejmuje m.in.:",1,"c"]]},{"k":"ul","r":[["IKE, czyli Indywidualne Konto Emerytalne,",1,"c"]]},{"k":"ul","r":[["IKZE, czyli Indywidualne Konto Zabezpieczenia Emerytalnego,",1,"c"]]},{"k":"ul","r":[["PPK, czyli Pracownicze Plany Kapitałowe,",1,"c"]]},{"k":"ul","r":[["dodatkowe ubezpieczenia i programy emerytalne.",1,"c"]]},{"k":"p","r":[["Wiek emerytalny w Polsce wynosi obecnie 60 lat dla kobiet i 65 lat dla mężczyzn.",1,"c"]]},{"k":"h","r":[["System ubezpieczenia zdrowotnego",1,0]]},{"k":"p","r":[["System ubezpieczenia zdrowotnego w Polsce jest finansowany głównie ze składki zdrowotnej.",1,"c"]]},{"k":"p","r":[["Składkę pobiera ZUS, a następnie przekazuje ją do Narodowego Funduszu Zdrowia, czyli NFZ.",1,"c"]]},{"k":"p","r":[["System zdrowotny opiera się na zasadzie solidarności społecznej. Oznacza to, że osoby ubezpieczone mają dostęp do świadczeń zdrowotnych niezależnie od indywidualnego ryzyka zachorowania, a wysokość składki zależy głównie od dochodu.",1,"c"]]},{"k":"p","r":[["Prawo do świadczeń zdrowotnych mają przede wszystkim osoby objęte obowiązkowym ubezpieczeniem zdrowotnym, ale możliwe jest także dobrowolne ubezpieczenie.",0,0]]},{"k":"p","r":[["Świadczenia finansowane ze środków publicznych obejmują m.in.:",1,"c"]]},{"k":"ul","r":[["wizyty lekarskie,",1,"c"]]},{"k":"ul","r":[["leczenie szpitalne,",1,"c"]]},{"k":"ul","r":[["diagnostykę,",1,"c"]]},{"k":"ul","r":[["refundację części leków,",1,"c"]]},{"k":"ul","r":[["rehabilitację,",1,"c"]]},{"k":"ul","r":[["świadczenia profilaktyczne.",1,"c"]]},{"k":"h","r":[["Rola ZUS i NFZ",1,0]]},{"k":"p","r":[["W systemie zabezpieczenia społecznego ważną rolę pełnią dwie instytucje:",0,0]]},{"k":"ul","r":[["ZUS – pobiera składki, prowadzi konta ubezpieczonych i wypłaca świadczenia, m.in. emerytury, renty i zasiłki,",1,"c"]]},{"k":"ul","r":[["NFZ – finansuje świadczenia zdrowotne ze środków pochodzących ze składki zdrowotnej.",1,"c"]]},{"k":"h","r":[["Wyzwania systemu",1,0]]},{"k":"p","r":[["Do głównych wyzwań systemu emerytalnego i zdrowotnego należą:",0,0]]},{"k":"ul","r":[["starzenie się społeczeństwa,",1,"c"]]},{"k":"ul","r":[["wydłużanie życia,",1,"c"]]},{"k":"ul","r":[["niski poziom dodatkowego oszczędzania na emeryturę,",1,"c"]]},{"k":"ul","r":[["obciążenie finansów publicznych,",1,"c"]]},{"k":"ul","r":[["kolejki i ograniczony dostęp do części świadczeń zdrowotnych.",1,"c"]]}],"k":[{"t":"System emerytalny w Polsce","s":["emeryt p","r":[["Struktura kapitału oznacza sposób finansowania przedsiębiorstwa, czyli udział kapitału własnego i kapitału obcego, głównie długu, w finansowaniu działalności firmy. Decyzje dotyczące struktury kapitału wpływają na ryzyko, rentowność i wartość przedsiębiorstwa.",1,"c"]]},{"k":"h","r":[["Struktura kapitału",1,0]]},{"k":"p","r":[["Kapitał przedsiębiorstwa może pochodzić z dwóch podstawowych źródeł:",0,0]]},{"k":"ul","r":[["kapitału własnego – np. środki właścicieli, akcje, zyski zatrzymane,",1,"c"]]},{"k":"ul","r":[["kapitału obcego – np. kredyty, pożyczki, obligacje.",1,"c"]]},{"k":"p","r":[["Kapitał własny jest zwykle droższy, ponieważ właściciele ponoszą większe ryzyko i oczekują wyższej stopy zwrotu. Kapitał obcy jest często tańszy, ale zwiększa zadłużenie i ryzyko finansowe.",1,"c"]]},{"k":"p","r":[["Koszt kapitału oznacza minimalną stopę zwrotu oczekiwaną przez dostawców kapitału. Dla właścicieli jest to oczekiwany zysk z inwestycji, a dla wierzycieli — oprocentowanie długu.",1,"c"]]},{"k":"p","r":[["Najczęściej stosowaną miarą jest WACC, czyli średni ważony koszt kapitału. Uwzględnia on koszt kapitału własnego i obcego oraz ich udział w strukturze finansowania.",1,"c"]]},{"k":"p","r":[["WACC jest ważny, ponieważ służy m.in. do:",0,0]]},{"k":"ul","r":[["oceny opłacalności inwestycji,",1,"c"]]},{"k":"ul","r":[["wyceny przedsiębiorstwa,",1,"c"]]},{"k":"ul","r":[["podejmowania decyzji finansowych,",1,"c"]]},{"k":"ul","r":[["określania minimalnej wymaganej stopy zwrotu.",1,"c"]]},{"k":"h","r":[["Dźwignia finansowa",1,"c"]]},{"k":"p","r":[["Dźwignia finansowa oznacza wykorzystanie długu do finansowania działalności. Może zwiększać rentowność kapitału własnego, ale jednocześnie zwiększa ryzyko.",1,"c"]]},{"k":"p","r":[["Im większe zadłużenie, tym:",1,"c"]]},{"k":"ul","r":[["większe koszty odsetek, * większe ryzyko niewypłacalności,",1,"c"]]},{"k":"ul","r":[["większa zmienność zysków właścicieli, * większe ryzyko finansowe.",1,"c"]]},{"k":"h","r":[["Teorie struktury kapitału",1,0]]},{"k":"h","r":[["1. Podejście tradycyjne",1,"c"]]},{"k":"p","r":[["Zakłada, że istnieje optymalna struktura kapitału, czyli taki udział długu i kapitału własnego, który minimalizuje WACC i maksymalizuje wartość firmy.",1,"c"]]},{"k":"p","r":[["Według tego podejścia umiarkowane zadłużenie może być korzystne, ale zbyt wysoki dług zwiększa ryzyko i koszt kapitału.",1,"c"]]},{"k":"h","r":[["2. Teoria Modiglianiego-Millera",1,"c"]]},{"k":"p","r":[["W podstawowej wersji, bez podatków, teoria ta zakłada, że struktura kapitału nie wpływa na wartość przedsiębiorstwa. Wartość firmy zależy od jej aktywów i generowanych przepływów pieniężnych, a nie od sposobu finansowania. W wersji z podatkiem dochodowym dług może zwiększać wartość firmy, ponieważ odsetki od długu tworzą tzw. tarczę podatkową.",1,"c"]]},{"k":"h","r":[["3. Teoria wymiany",1,"c"]]},{"k":"p","r":[["Teoria wymiany zakłada, że firma powinna szukać równowagi między korzyściami z długu a kosztami zadłużenia. Korzyścią jest tarcza podatkowa, a kosztami są m.in.:",1,"c"]]},{"k":"ul","r":[["ryzyko trudności finansowych,",1,"c"]]},{"k":"ul","r":[["koszty upadłości,",1,"c"]]},{"k":"ul","r":[["koszty agencji,",1,"c"]]},{"k":"ul","r":[["wzrost ryzyka dla właścicieli i wierzycieli.",1,"c"]]},{"k":"h","r":[["4. Teoria hierarchii źródeł finansowania",1,"c"]]},{"k":"p","r":[["Zakłada, że przedsiębiorstwa preferują finansowanie według określonej kolejności:",1,"c"]]},{"k":"ul","r":[["najpierw zyski zatrzymane,",1,"c"]]},{"k":"ul","r":[["potem dług,",1,"c"]]},{"k":"ul","r":[["na końcu emisję nowych akcji.",1,"c"]]}],"k":[{"t":"Struktura kapitału","s":["kapit","strukt"]},{"t":"kapitału własnego","s":["kapit","wlasn"]},{"t":"kapitału obcego","s":["kapit","obce"]},{"t":"oceny opłacalności inwestycji","s":["inwesty","ocen","oplacalno"]},{"t":"wyceny przedsiębiorstwa","s":["przedsiebiors","wyce"]},{"t":"podejmowania decyzji finansowych","s":["decy","finansow","podejmowa"]},{"t":"określania minimalnej wymaganej s /* Porównanie: które kluczowe pojęcia z notatek padły w odpowiedzi.
   Polska odmiana: porównuję początki słów, więc „płynności” i „płynność” to to samo. */
function norm(s) { return s.toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function stem(w) { const n = w.length; return n <= 4 ? w : w.slice(0, Math.max(4, n - 3)); }
function compare(card, text) {
  const raw = norm(text).match(/[a-z0-9]+/g) || [];
  const toks = []; let buf = '';
  for (const t of raw) {
    if (t.length === 1 && /[a-z]/.test(t)) { buf += t; continue; }
    if (buf) { toks.push(buf); buf = ''; }
    toks.push(t);
  }
  if (buf) toks.push(buf);
  const all = new Set(toks);
  const initials = toks.map(t => t[0]).join('');
  const stems = toks.filter(w => !STOP.has(w) && (w.length >= 4 || /^\d+$/.test(w))).map(stem);
  const hit = s => {
    if (s.length < 4) return all.has(s);
    return stems.some(t => t.length >= 4 && (t.startsWith(s) || s.startsWith(t)));
  };
  const said = [], missed = [];
  for (const c of card.k) {
    let ok;
    if (c.a) ok = all.has(c.s[0]) || initials.includes(c.s[0]);
    else ok = c.s.filter(hit).length / c.s.length >= 0.6;
    (ok ? said : missed).push(c.t);
  }
  return { said, missed };
}

    '<button type="button" class="front ruled" id="reveal"><span class="q" role="heading" aria-level="2">' + esc(cur.q) + '</span></button>' +
    '<div class="speak">' +
      (SR ? '<div class="mic-row"><button type="button" class="mic" id="mic" aria-pressed="false"><span class="dot"></span><span class="lbl">Mów</span></button>' +
        '<p class="mic-msg" id="micMsg">Stuknij „Mów” i odpowiedz na głos.</p></div>' : '') +
      '<label for="answer" class="label">Twoja odpowiedź</label>' +
      '<textarea id="answer" class="ruled" placeholder="' + (SR ? 'Tu pojawi się to, co powiesz.' : 'Stuknij tutaj i dyktuj mikrofonem z klawiatury.') + '"></textarea>' +
    '</div>' +
    '<div class="actions"><button type="button" class="btn primary" id="reveal2">Pokaż odpowiedź</button>' +
    '<button type="button" class="btn ghost" id="other">Inne pytanie</button></div>';
  const ta = $('#answer');
  ta.value = draft;
  ta.addEventListener('input', () => { draft = ta.value; updateRevealLabel(); });
  updateRevealLabel();
}

function resultHTML(said, missed) {
  const total = said.length + missed.length;
  if (!total) return '';
  const pct = Math.round(said.length / total * 100);
  const verdict = pct >= 60 ? 'Bardzo dobrze' : pct >= 30 ? 'Dobrze, ale czegoś brakuje' : 'Do powtórki';
  return '<section class="result">' +
    '<div class="score"><span class="score-num">' + said.length + '<small> / ' + total + '</small></span>' +
      '<div class="score-txt"><b>' + verdict + '</b><span>tyle kluczowych pojęć z notatek padło w Twojej odpowiedzi</span></div></div>' +
    '<div class="meter"><i style="width:' + pct + '%"></i></div>' +
    (said.length ? '<h3 class="label">Powiedziałaś</h3><ul class="chips ok">' + said.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' : '') +
    (missed.length ? '<h3 class="label">Zabrakło</h3><ul class="chips miss">' + missed.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' : '') +
    '<details class="yours"><summary>Pokaż, co powiedziałaś</summary><p>' + esc(draft.trim()) + '</p></details>' +
    '<p class="note">Automat szuka pojęć z notatek, nie ocenia sensu. Czy dobrze to wytłumaczyłaś, sprawdź w odpowiedzi poniżej.</p>' +
  '</section>';
}

let lastResult = '';
function renderBack() {
  side = 'back';
  const marks = cardHasMarks(cur);
  const pill = marks && S.view === 'pill';
  cardEl.innerHTML = headHTML(cur) +
    '<div class="back-q">' + esc(cur.q) + '</div>' +
    lastResult +
    '<section class="model"><div class="model-head"><h3 class="label">Odpowiedź z notatek</h3>' +
      (marks ? '<div class="seg" role="group" aria-label="Widok odpowiedzi">' +
        '<button type="button" data-view="full" aria-pressed="' + !pill + '">Całość</button>' +
        '<button type="button" data-view="pill" aria-pressed="' + pill + '">W pigułce</button></div>' : '') +
    '</div>' +
    (pill ? '<p class="legend">Tylko fragmenty <mark>zaznaczone</mark> w notatkach.</p>' : '') +
    '<div class="answer">' + answerHTML(cur, pill) + '</div></section>' +
    '<div class="actions sticky"><button type="button" class="btn primary" id="next">Następne pytanie</button></div>';
}
function flip(render) {
  if (reduceMotion || !cardEl.animate) { render(); return; }
  cardEl.animate([{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(90deg)' }], { duration: 140, easing: 'ease-in' })
    .finished.then(() => { render(); cardEl.animate([{ transform: 'rotateY(-90deg)' }, { transform: 'rotateY(0deg)' }], { duration: 180, easing: 'ease-out' }); });
}
function reveal() {
  if (side !== 'front') return;
  const wasListening = listening || rec;
  if (wasListening) stopListening();
  setTimeout(() => {
    if (side !== 'front') return;
    const ta = $('#answer'); if (ta) draft = ta.value;
    killListening();
    if (draft.trim()) { const r = compare(cur, draft); lastResult = resultHTML(r.said, r.missed); }
    else lastResult = '';
    flip(renderBack);
  }, wasListening ? 700 : 0);
}
function toTop() { if (cardEl.getBoundingClientRect().top < 0) cardEl.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' }); }
function show(id, animate) {
  killListening();
  cur = byId[id]; draft = ''; lastResult = '';
  renderFront(); updateCount();
  if (animate && !reduceMotion && cardEl.animate) cardEl.animate([{ transform: 'translateX(18px)', opacity: .4 }, { transform: 'none', opacity: 1 }], { duration: 200, easing: 'ease-out' });
  toTop();
}
function next() {
  pos++;
  if (pos >= queue.length) newRound(cur && cur.id);
  show(queue[pos], true);
}
function updateCount() { $('#count').textContent = (pos + 1) + ' z ' + queue.length + ' w tej rundzie'; }

function renderList(filter) {
  const f = norm((filter || '').trim());
  const items = CARDS.filter(c => !f || norm(c.q).includes(f));
  $('#qlistWrap').innerHTML = items.length ? '<ul class="qlist">' + items.map(c =>
    '<li><button type="button" data-open="' + c.id + '"><span class="num">' + c.n + '.</span><span>' + esc(c.q) + '</span></button></li>').join('') + '</ul>'
    : '<p class="empty">Nie ma pytania z takim słowem.</p>';
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.view) { S.view = t.dataset.view; save(); renderBack(); return; }
  if (t.dataset.open) {
    $('#allDetails').open = false;
    show(t.dataset.open, true);
    cardEl.scrollIntoView({ block: 'start', behavior: reduceMotion ? 'auto' : 'smooth' });
    return;
  }
  if (t.id === 'mic') return listening ? stopListening() : startListening();
  if (t.id === 'reveal' || t.id === 'reveal2') return reveal();
  if (t.id === 'next' || t.id === 'other') return next();
});
document.addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) {
    if (e.target.tagName === 'TEXTAREA' && (e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); reveal(); }
    return;
  }
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') {
    if (e.target.closest && e.target.closest('button, summary') && e.key !== 'ArrowRight') return;
    e.preventDefault();
    side === 'front' ? reveal() : next();
  }
});
$('#search').addEventListener('input', e => renderList(e.target.value));

renderList('');
newRound();
show(queue[0], false);

/* Sprzątanie po starych wersjach: wyłączam zapisywanie kopii offline i kasuję stare kopie. */
try {
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
} catch (e) {}
</script>
</body>
</html>
